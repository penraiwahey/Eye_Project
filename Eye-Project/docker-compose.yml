services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-admin_panel}
      MYSQL_USER: ${DB_USER:-admin_panel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
    ports:
      # Host port 3307 -> container 3306, since 3306 is already taken locally (e.g. by XAMPP).
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD:-change_me_root_password}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
